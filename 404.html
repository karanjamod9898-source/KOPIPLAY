<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NexusPlay - Redirecting...</title>
  <script>
    // GitHub Pages Single Page App Redirect
    // Redirects deep links to index.html with appropriate hash route
    (function () {
      var path = window.location.pathname;
      var repo = ''; // If repository name is in path, e.g. /reponame/
      var segments = path.split('/').filter(Boolean);
      
      // If deployed on github.io/<repo>/, detect repo name
      var host = window.location.hostname;
      var isGitHubPages = host.includes('github.io');
      var cleanSegments = segments;
      
      if (isGitHubPages && segments.length > 0) {
        repo = '/' + segments[0];
        cleanSegments = segments.slice(1);
      }
      
      var route = cleanSegments.join('/');
      if (route) {
        window.location.replace(repo + '/#/' + route + window.location.search);
      } else {
        window.location.replace(repo + '/');
      }
    })();
  </script>
  <style>
    body {
      background: #0A0D14;
      color: #F8FAFC;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      margin: 0;
      text-align: center;
    }
    .card {
      background: #121620;
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 16px;
      padding: 40px;
      max-width: 480px;
      box-shadow: 0 10px 40px rgba(0, 0, 0, 0.5);
    }
    h1 { margin: 0 0 12px 0; font-size: 1.8rem; }
    p { color: #94A3B8; line-height: 1.6; margin-bottom: 24px; }
    a {
      display: inline-block;
      background: linear-gradient(135deg, #2563EB 0%, #7C3AED 100%);
      color: #FFF;
      padding: 10px 24px;
      border-radius: 8px;
      text-decoration: none;
      font-weight: 600;
    }
  </style>
</head>
<body>
  <div class="card">
    <h1>Page Not Found</h1>
    <p>The page you are looking for has been moved or does not exist. Redirecting you to the home catalog...</p>
    <a href="./">Return to NexusPlay</a>
  </div>
</body>
</html>
