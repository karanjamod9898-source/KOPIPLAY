<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <!-- Primary Meta Tags -->
  <title>KopiPlay – Play Free Online Games</title>
  <meta name="title" content="KopiPlay – Play Free Online Games">
  <meta name="description"
    content="Discover KopiPlay, your destination for free online games. Play browser-based action, racing, puzzle, adventure, shooting and sports games on desktop and mobile.">
  <meta name="keywords"
    content="online games, browser games, free games, kopiplay, kopi games, html5 games, car games, puzzle games, shooting games, action games">
  <meta name="author" content="KopiPlay">
  <meta name="theme-color" content="#2563EB">
  <link rel="canonical" href="https://kipo.in/">

  <!-- Favicon & Web App Manifest -->
  <link rel="icon" type="image/svg+xml" href="assets/images/favicon.svg">
  <link rel="manifest" href="manifest.json">

  <!-- Open Graph / Facebook -->
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://kipo.in/">
  <meta property="og:title" content="KopiPlay – Play Free Online Games">
  <meta property="og:description"
    content="Discover KopiPlay, your destination for free online games. Play browser-based action, racing, puzzle, adventure, shooting and sports games on desktop and mobile.">
  <meta property="og:image" content="assets/images/logo.svg">

  <!-- Twitter -->
  <meta property="twitter:card" content="summary_large_image">
  <meta property="twitter:url" content="https://kipo.in/">
  <meta property="twitter:title" content="KopiPlay – Play Free Online Games">
  <meta property="twitter:description"
    content="Discover KopiPlay, your destination for free online games. Play browser-based action, racing, puzzle, adventure, shooting and sports games on desktop and mobile.">
  <meta property="twitter:image" content="assets/images/logo.svg">

  <!-- Third-Party Game CDN Preconnect & Performance Hints -->
  <link rel="preconnect" href="https://cdn.htmlgames.com" crossorigin>
  <link rel="dns-prefetch" href="https://cdn.htmlgames.com">
  <link rel="preconnect" href="https://www.htmlgames.com" crossorigin>
  <link rel="dns-prefetch" href="https://www.htmlgames.com">

  <!-- Google Fonts: Inter and Outfit -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Outfit:wght@500;600;700;800;900&display=swap"
    rel="stylesheet">

  <!-- Structured Data JSON-LD for Search Engines -->
  <script type="application/ld+json" id="kopi-schema">
  {
    "@context": "https://schema.org",
    "@type": "WebSite",
    "name": "KopiPlay",
    "alternateName": "KopiPlay Online Games",
    "url": "https://kipo.in/",
    "description": "KopiPlay is an online gaming platform where players can discover and enjoy browser-based games across multiple categories, including Action, Adventure, Racing, Puzzle, Shooting and Sports."
  }
  </script>

  <!-- Stylesheets -->
  <link rel="stylesheet" href="css/main.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/player.css">
  <link rel="stylesheet" href="css/responsive.css">
</head>

<body>
  <!-- App Layout with Sidebar and Main Content -->
  <div class="app-layout" id="app-layout">
    <!-- Left Navigation Sidebar -->
    <aside id="app-sidebar" class="site-sidebar" aria-label="Sidebar Navigation"></aside>

    <!-- Main Content Area -->
    <div class="app-main-wrapper" id="app-main-wrapper">
      <!-- Top Header Container -->
      <header id="app-header" class="site-header"></header>

      <!-- Main Views Container -->
      <main id="app-main" class="main-content" role="main"></main>

      <!-- Footer App Container -->
      <footer id="app-footer" class="site-footer"></footer>
    </div>
  </div>

  <!-- Mobile Drawer Overlay Backdrop -->
  <div class="mobile-drawer-overlay" id="mobile-drawer-overlay"></div>

  <!-- Modal Container for Report Game & Feedback -->
  <div id="kopi-modal-root"></div>
  <div id="nexus-modal-root"></div>

  <!-- Toast Notification Container -->
  <div id="toast-container" class="toast-container" aria-live="polite"></div>

  <!-- Floating Back to Top Button -->
  <button id="back-to-top" class="back-to-top-btn" aria-label="Back to top">
    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"
      stroke-linecap="round" stroke-linejoin="round">
      <line x1="12" y1="19" x2="12" y2="5" />
      <polyline points="5 12 12 5 19 12" />
    </svg>
    <span>Back to Top</span>
  </button>

  <!-- Universal JavaScript Bundle (Runs seamlessly on file:/// and HTTP/HTTPS) -->
  <script src="data/catalogData.js"></script>
  <script src="js/bundle.js"></script>
</body>

</html>
