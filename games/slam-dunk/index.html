<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Hyper Hoops: Street Dunk 2D</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
    body {
      background: #080c16;
      color: #fff;
      font-family: 'Segoe UI', system-ui, sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      padding: 12px;
    }
    #game-container {
      position: relative;
      width: 100%;
      max-width: 640px;
      height: 100vh;
      max-height: 720px;
      background: #0d1424;
      border-radius: 12px;
      overflow: hidden;
      border: 1px solid rgba(236, 72, 153, 0.4);
      box-shadow: 0 0 40px rgba(236, 72, 153, 0.2);
    }
    canvas { display: block; width: 100%; height: 100%; touch-action: none; }
    .hud {
      position: absolute;
      top: 14px;
      left: 14px;
      right: 14px;
      display: flex;
      justify-content: space-between;
      pointer-events: none;
      z-index: 10;
    }
    .hud-box {
      background: rgba(13, 20, 36, 0.85);
      border: 1px solid rgba(236, 72, 153, 0.35);
      padding: 6px 14px;
      border-radius: 8px;
    }
    .hud-label {
      font-size: 10px;
      text-transform: uppercase;
      letter-spacing: 1px;
      color: #ec4899;
      font-weight: 700;
    }
    .hud-val { font-size: 18px; font-weight: 800; }
    .overlay {
      position: absolute;
      inset: 0;
      background: rgba(10, 14, 24, 0.88);
      backdrop-filter: blur(6px);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 24px;
      z-index: 20;
    }
    .overlay.hidden { display: none; }
    .title {
      font-size: 32px;
      font-weight: 900;
      background: linear-gradient(135deg, #ec4899, #f59e0b);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      margin-bottom: 8px;
    }
    .btn {
      background: linear-gradient(135deg, #ec4899, #f43f5e);
      color: #fff;
      font-weight: 800;
      padding: 12px 32px;
      border: none;
      border-radius: 9999px;
      font-size: 15px;
      cursor: pointer;
      box-shadow: 0 0 20px rgba(236, 72, 153, 0.4);
      margin-top: 16px;
    }
  </style>
</head>
<body>
  <div id="game-container">
    <canvas id="canvas"></canvas>

    <div class="hud">
      <div class="hud-box">
        <div class="hud-label">Score</div>
        <div class="hud-val" id="hud-score">0</div>
      </div>
      <div class="hud-box" style="text-align: center;">
        <div class="hud-label">Streak</div>
        <div class="hud-val" id="hud-streak">0 🔥</div>
      </div>
      <div class="hud-box" style="text-align: right;">
        <div class="hud-label">Time</div>
        <div class="hud-val" id="hud-time">60s</div>
      </div>
    </div>

    <div class="overlay" id="overlay">
      <h1 class="title" id="overlay-title">HYPER HOOPS</h1>
      <p style="color: #94a3b8; font-size: 14px; max-width: 300px;" id="overlay-sub">
        Click & drag the basketball to set your arc trajectory, then release to shoot! Chain swishes for combo points.
      </p>
      <button class="btn" id="start-btn">START SHOOTING</button>
    </div>
  </div>

  <script>
    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d');
    const hudScore = document.getElementById('hud-score');
    const hudStreak = document.getElementById('hud-streak');
    const hudTime = document.getElementById('hud-time');
    const overlay = document.getElementById('overlay');
    const overlayTitle = document.getElementById('overlay-title');
    const overlaySub = document.getElementById('overlay-sub');
    const startBtn = document.getElementById('start-btn');

    let W, H;
    function resize() {
      const container = document.getElementById('game-container');
      W = canvas.width = container.clientWidth;
      H = canvas.height = container.clientHeight;
    }
    window.addEventListener('resize', resize);
    resize();

    let state = 'MENU';
    let score = 0;
    let streak = 0;
    let timeLeft = 60;
    let timerInterval = null;

    const ball = {
      x: 120,
      y: 450,
      r: 16,
      vx: 0,
      vy: 0,
      inFlight: false
    };

    const hoop = {
      x: 480,
      y: 220,
      rimW: 64,
      rimH: 8
    };

    let isAiming = false;
    let aimStart = { x: 0, y: 0 };
    let aimCurrent = { x: 0, y: 0 };
    let particles = [];

    function resetGame() {
      score = 0;
      streak = 0;
      timeLeft = 60;
      hudScore.textContent = '0';
      hudStreak.textContent = '0 🔥';
      hudTime.textContent = '60s';
      resetBall();
      state = 'PLAYING';
      overlay.classList.add('hidden');

      clearInterval(timerInterval);
      timerInterval = setInterval(() => {
        if (state === 'PLAYING') {
          timeLeft--;
          hudTime.textContent = timeLeft + 's';
          if (timeLeft <= 0) gameOver();
        }
      }, 1000);
    }
    startBtn.addEventListener('click', resetGame);

    function resetBall() {
      ball.x = 100 + Math.random() * 80;
      ball.y = H - 140;
      ball.vx = 0;
      ball.vy = 0;
      ball.inFlight = false;
    }

    // Input handlers
    canvas.addEventListener('pointerdown', e => {
      if (state !== 'PLAYING' || ball.inFlight) return;
      const rect = canvas.getBoundingClientRect();
      const mx = e.clientX - rect.left;
      const my = e.clientY - rect.top;

      if (Math.hypot(mx - ball.x, my - ball.y) < 50) {
        isAiming = true;
        aimStart = { x: ball.x, y: ball.y };
        aimCurrent = { x: mx, y: my };
      }
    });

    canvas.addEventListener('pointermove', e => {
      if (!isAiming) return;
      const rect = canvas.getBoundingClientRect();
      aimCurrent = {
        x: e.clientX - rect.left,
        y: e.clientY - rect.top
      };
    });

    canvas.addEventListener('pointerup', () => {
      if (!isAiming) return;
      isAiming = false;
      const dx = aimStart.x - aimCurrent.x;
      const dy = aimStart.y - aimCurrent.y;
      ball.vx = dx * 7.5;
      ball.vy = dy * 7.5;
      ball.inFlight = true;
    });

    function update(dt) {
      if (state !== 'PLAYING') return;

      hoop.x = W - 110;
      hoop.y = H * 0.35;

      if (ball.inFlight) {
        ball.vy += 800 * dt; // gravity
        ball.x += ball.vx * dt;
        ball.y += ball.vy * dt;

        // Particle trail
        if (Math.random() < 0.4) {
          particles.push({
            x: ball.x,
            y: ball.y,
            r: Math.random() * 4 + 2,
            color: streak >= 2 ? '#ff0055' : '#f59e0b',
            life: 0.3
          });
        }

        // Check hoop basket
        const rimLeft = hoop.x - hoop.rimW / 2;
        const rimRight = hoop.x + hoop.rimW / 2;
        const rimY = hoop.y;

        if (
          ball.vy > 0 &&
          ball.y >= rimY - 8 &&
          ball.y <= rimY + 16 &&
          ball.x >= rimLeft + 4 &&
          ball.x <= rimRight - 4
        ) {
          // Basket scored!
          streak++;
          const pts = 2 + (streak > 2 ? streak : 0);
          score += pts;
          hudScore.textContent = score;
          hudStreak.textContent = `${streak} 🔥`;

          for (let i = 0; i < 14; i++) {
            particles.push({
              x: hoop.x,
              y: hoop.y,
              vx: (Math.random() - 0.5) * 180,
              vy: Math.random() * -120 - 40,
              r: 4,
              color: '#ec4899',
              life: 0.5
            });
          }

          resetBall();
        }

        // Rim bounce
        if (Math.hypot(ball.x - rimLeft, ball.y - rimY) < ball.r) {
          ball.vx = -Math.abs(ball.vx) * 0.6;
          ball.vy *= -0.7;
        }
        if (Math.hypot(ball.x - rimRight, ball.y - rimY) < ball.r) {
          ball.vx = Math.abs(ball.vx) * 0.6;
          ball.vy *= -0.7;
        }

        // Backboard bounce
        const boardX = hoop.x + hoop.rimW / 2 + 10;
        if (ball.x + ball.r >= boardX && ball.y >= hoop.y - 70 && ball.y <= hoop.y + 40) {
          ball.x = boardX - ball.r;
          ball.vx = -Math.abs(ball.vx) * 0.7;
        }

        // Bounds reset
        if (ball.y > H + 40 || ball.x > W + 40 || ball.x < -40) {
          streak = 0;
          hudStreak.textContent = '0 🔥';
          resetBall();
        }
      }

      // Update particles
      for (let i = particles.length - 1; i >= 0; i--) {
        const p = particles[i];
        p.life -= dt;
        if (p.vx) p.x += p.vx * dt;
        if (p.vy) p.y += p.vy * dt;
        if (p.life <= 0) particles.splice(i, 1);
      }
    }

    function gameOver() {
      state = 'GAMEOVER';
      clearInterval(timerInterval);
      overlayTitle.textContent = 'BUZZER BEATER!';
      overlaySub.innerHTML = `Final Score: <strong style="color:#ec4899;font-size:24px;">${score}</strong><br>Highest Streak: ${streak} 🔥`;
      startBtn.textContent = 'PLAY AGAIN';
      overlay.classList.remove('hidden');
    }

    function draw() {
      ctx.fillStyle = '#080c16';
      ctx.fillRect(0, 0, W, H);

      // Court floor
      ctx.fillStyle = '#0f172a';
      ctx.fillRect(0, H - 70, W, 70);
      ctx.strokeStyle = 'rgba(236, 72, 153, 0.3)';
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.moveTo(0, H - 70);
      ctx.lineTo(W, H - 70);
      ctx.stroke();

      // Basketball Hoop Backboard
      const boardX = hoop.x + hoop.rimW / 2 + 10;
      ctx.strokeStyle = '#fff';
      ctx.lineWidth = 4;
      ctx.beginPath();
      ctx.moveTo(boardX, hoop.y - 70);
      ctx.lineTo(boardX, hoop.y + 30);
      ctx.stroke();

      // Rim
      ctx.strokeStyle = '#ff7700';
      ctx.lineWidth = 5;
      ctx.beginPath();
      ctx.moveTo(hoop.x - hoop.rimW / 2, hoop.y);
      ctx.lineTo(hoop.x + hoop.rimW / 2, hoop.y);
      ctx.stroke();

      // Net lines
      ctx.strokeStyle = 'rgba(255, 255, 255, 0.6)';
      ctx.lineWidth = 1.5;
      ctx.beginPath();
      ctx.moveTo(hoop.x - hoop.rimW / 2, hoop.y);
      ctx.lineTo(hoop.x - hoop.rimW / 4, hoop.y + 35);
      ctx.lineTo(hoop.x + hoop.rimW / 4, hoop.y + 35);
      ctx.lineTo(hoop.x + hoop.rimW / 2, hoop.y);
      ctx.stroke();

      // Aim trajectory dots
      if (isAiming) {
        ctx.strokeStyle = 'rgba(236, 72, 153, 0.7)';
        ctx.setLineDash([6, 6]);
        ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.moveTo(ball.x, ball.y);
        ctx.lineTo(ball.x + (aimStart.x - aimCurrent.x) * 1.5, ball.y + (aimStart.y - aimCurrent.y) * 1.5);
        ctx.stroke();
        ctx.setLineDash([]);
      }

      // Ball
      ctx.save();
      ctx.shadowBlur = 12;
      ctx.shadowColor = '#f59e0b';
      ctx.fillStyle = '#f97316';
      ctx.beginPath();
      ctx.arc(ball.x, ball.y, ball.r, 0, Math.PI * 2);
      ctx.fill();
      ctx.strokeStyle = '#000';
      ctx.lineWidth = 1.5;
      ctx.beginPath();
      ctx.arc(ball.x, ball.y, ball.r, 0, Math.PI * 2);
      ctx.stroke();
      ctx.restore();

      // Particles
      particles.forEach(p => {
        ctx.fillStyle = p.color;
        ctx.beginPath();
        ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
        ctx.fill();
      });
    }

    let last = performance.now();
    function loop(now) {
      const dt = Math.min((now - last) / 1000, 0.1);
      last = now;
      update(dt);
      draw();
      requestAnimationFrame(loop);
    }
    requestAnimationFrame(loop);
  </script>
</body>
</html>
