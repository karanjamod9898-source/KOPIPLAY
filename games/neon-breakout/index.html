<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Neon Breaker DX</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
    }
    body {
      background: #070912;
      color: #fff;
      font-family: 'Segoe UI', system-ui, sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 12px;
      overflow: hidden;
    }
    #game-container {
      position: relative;
      width: 100%;
      max-width: 540px;
      height: 100vh;
      max-height: 720px;
      background: #090d1a;
      border-radius: 12px;
      overflow: hidden;
      border: 1px solid rgba(255, 51, 102, 0.4);
      box-shadow: 0 0 40px rgba(255, 51, 102, 0.15);
    }
    canvas {
      display: block;
      width: 100%;
      height: 100%;
    }
    .hud {
      position: absolute;
      top: 12px;
      left: 12px;
      right: 12px;
      display: flex;
      justify-content: space-between;
      pointer-events: none;
      z-index: 10;
    }
    .hud-box {
      background: rgba(12, 16, 30, 0.8);
      border: 1px solid rgba(255, 51, 102, 0.3);
      padding: 4px 12px;
      border-radius: 6px;
    }
    .hud-label {
      font-size: 9px;
      text-transform: uppercase;
      letter-spacing: 1px;
      color: #ff3366;
      font-weight: 700;
    }
    .hud-val {
      font-size: 16px;
      font-weight: 800;
    }
    .overlay {
      position: absolute;
      inset: 0;
      background: rgba(7, 9, 18, 0.88);
      backdrop-filter: blur(6px);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 24px;
      z-index: 20;
    }
    .overlay.hidden { display: none; }
    .title {
      font-size: 32px;
      font-weight: 900;
      background: linear-gradient(135deg, #ff3366, #ff9900);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      margin-bottom: 8px;
    }
    .btn {
      background: linear-gradient(135deg, #ff3366, #ff0055);
      color: #fff;
      font-weight: 800;
      padding: 12px 32px;
      border: none;
      border-radius: 9999px;
      font-size: 15px;
      cursor: pointer;
      box-shadow: 0 0 20px rgba(255, 51, 102, 0.4);
      margin-top: 16px;
    }
  </style>
</head>
<body>
  <div id="game-container">
    <canvas id="canvas"></canvas>
    
    <div class="hud">
      <div class="hud-box">
        <div class="hud-label">Score</div>
        <div class="hud-val" id="hud-score">0</div>
      </div>
      <div class="hud-box" style="text-align: right;">
        <div class="hud-label">Balls Left</div>
        <div class="hud-val" id="hud-lives">●●●</div>
      </div>
    </div>

    <div class="overlay" id="overlay">
      <h1 class="title" id="overlay-title">NEON BREAKER DX</h1>
      <p style="color: #94a3b8; font-size: 14px; max-width: 300px;" id="overlay-sub">Shatter the glowing grid! Move the paddle with Mouse, Touch, or Arrow Keys.</p>
      <button class="btn" id="start-btn">LAUNCH SPHERE</button>
    </div>
  </div>

  <script>
    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d');
    const hudScore = document.getElementById('hud-score');
    const hudLives = document.getElementById('hud-lives');
    const overlay = document.getElementById('overlay');
    const overlayTitle = document.getElementById('overlay-title');
    const overlaySub = document.getElementById('overlay-sub');
    const startBtn = document.getElementById('start-btn');

    let W, H;
    function resize() {
      const container = document.getElementById('game-container');
      W = canvas.width = container.clientWidth;
      H = canvas.height = container.clientHeight;
    }
    window.addEventListener('resize', resize);
    resize();

    let state = 'MENU';
    let score = 0;
    let lives = 3;

    const paddle = {
      w: 90,
      h: 12,
      x: 200,
      y: 600
    };

    let balls = [];
    let bricks = [];
    let particles = [];

    function resetGame() {
      score = 0;
      lives = 3;
      hudScore.textContent = '0';
      hudLives.textContent = '●●●';
      paddle.x = W / 2 - paddle.w / 2;
      paddle.y = H - 60;
      balls = [{
        x: W / 2,
        y: H - 80,
        vx: 240,
        vy: -320,
        r: 7
      }];
      initBricks();
      state = 'PLAYING';
      overlay.classList.add('hidden');
    }
    startBtn.addEventListener('click', resetGame);

    function initBricks() {
      bricks = [];
      const rows = 5;
      const cols = 7;
      const pad = 12;
      const brickW = (W - pad * 2 - (cols - 1) * 8) / cols;
      const brickH = 20;
      const colors = ['#ff3366', '#ff9900', '#f59e0b', '#10b981', '#00f0ff'];

      for (let r = 0; r < rows; r++) {
        for (let c = 0; c < cols; c++) {
          bricks.push({
            x: pad + c * (brickW + 8),
            y: 70 + r * (brickH + 8),
            w: brickW,
            h: brickH,
            color: colors[r],
            points: (rows - r) * 50
          });
        }
      }
    }

    // Input
    window.addEventListener('pointermove', e => {
      const rect = canvas.getBoundingClientRect();
      const mx = e.clientX - rect.left;
      paddle.x = Math.max(0, Math.min(W - paddle.w, mx - paddle.w / 2));
    });

    window.addEventListener('keydown', e => {
      if (e.key === 'ArrowLeft' || e.key === 'a') paddle.x = Math.max(0, paddle.x - 30);
      if (e.key === 'ArrowRight' || e.key === 'd') paddle.x = Math.min(W - paddle.w, paddle.x + 30);
    });

    function update(dt) {
      if (state !== 'PLAYING') return;

      paddle.y = H - 60;

      // Update balls
      for (let bi = balls.length - 1; bi >= 0; bi--) {
        const b = balls[bi];
        b.x += b.vx * dt;
        b.y += b.vy * dt;

        // Wall bounce
        if (b.x < b.r) { b.x = b.r; b.vx *= -1; }
        if (b.x > W - b.r) { b.x = W - b.r; b.vx *= -1; }
        if (b.y < b.r) { b.y = b.r; b.vy *= -1; }

        // Paddle collision
        if (
          b.y + b.r >= paddle.y &&
          b.y - b.r <= paddle.y + paddle.h &&
          b.x >= paddle.x &&
          b.x <= paddle.x + paddle.w
        ) {
          b.vy = -Math.abs(b.vy);
          // Angle depends on where on the paddle it struck
          const hitPos = (b.x - (paddle.x + paddle.w / 2)) / (paddle.w / 2);
          b.vx = hitPos * 360;
        }

        // Brick collision
        for (let i = bricks.length - 1; i >= 0; i--) {
          const br = bricks[i];
          if (
            b.x + b.r > br.x &&
            b.x - b.r < br.x + br.w &&
            b.y + b.r > br.y &&
            b.y - b.r < br.y + br.h
          ) {
            b.vy *= -1;
            score += br.points;
            hudScore.textContent = score;

            // Particles
            for (let p = 0; p < 8; p++) {
              particles.push({
                x: br.x + br.w / 2,
                y: br.y + br.h / 2,
                vx: (Math.random() - 0.5) * 160,
                vy: (Math.random() - 0.5) * 160,
                color: br.color,
                life: 0.3
              });
            }

            bricks.splice(i, 1);
            break;
          }
        }

        // Bottom boundary (lost ball)
        if (b.y > H + 20) {
          balls.splice(bi, 1);
        }
      }

      // Check if all balls lost
      if (balls.length === 0) {
        lives--;
        hudLives.textContent = '●'.repeat(Math.max(0, lives));
        if (lives <= 0) {
          gameOver(false);
          return;
        } else {
          balls.push({
            x: W / 2,
            y: H - 80,
            vx: 240,
            vy: -320,
            r: 7
          });
        }
      }

      // Check win
      if (bricks.length === 0) {
        gameOver(true);
        return;
      }

      // Particles
      for (let i = particles.length - 1; i >= 0; i--) {
        const p = particles[i];
        p.x += p.vx * dt;
        p.y += p.vy * dt;
        p.life -= dt;
        if (p.life <= 0) particles.splice(i, 1);
      }
    }

    function gameOver(won) {
      state = won ? 'VICTORY' : 'GAMEOVER';
      overlayTitle.textContent = won ? 'GRID ANNIHILATED' : 'SPHERE DEPLETED';
      overlaySub.innerHTML = `Score: <strong style="color:#ff3366;">${score}</strong>`;
      startBtn.textContent = 'PLAY AGAIN';
      overlay.classList.remove('hidden');
    }

    function draw() {
      ctx.fillStyle = '#090d1a';
      ctx.fillRect(0, 0, W, H);

      // Bricks
      bricks.forEach(b => {
        ctx.save();
        ctx.shadowBlur = 8;
        ctx.shadowColor = b.color;
        ctx.fillStyle = b.color;
        ctx.beginPath();
        ctx.roundRect(b.x, b.y, b.w, b.h, 4);
        ctx.fill();
        ctx.restore();
      });

      // Paddle
      ctx.save();
      ctx.shadowBlur = 15;
      ctx.shadowColor = '#00f0ff';
      ctx.fillStyle = '#00f0ff';
      ctx.beginPath();
      ctx.roundRect(paddle.x, paddle.y, paddle.w, paddle.h, 6);
      ctx.fill();
      ctx.restore();

      // Balls
      balls.forEach(b => {
        ctx.save();
        ctx.shadowBlur = 12;
        ctx.shadowColor = '#ff3366';
        ctx.fillStyle = '#fff';
        ctx.beginPath();
        ctx.arc(b.x, b.y, b.r, 0, Math.PI * 2);
        ctx.fill();
        ctx.restore();
      });

      // Particles
      particles.forEach(p => {
        ctx.fillStyle = p.color;
        ctx.fillRect(p.x, p.y, 3, 3);
      });
    }

    let last = performance.now();
    function loop(now) {
      const dt = Math.min((now - last) / 1000, 0.1);
      last = now;
      update(dt);
      draw();
      requestAnimationFrame(loop);
    }
    requestAnimationFrame(loop);
  </script>
</body>
</html>
