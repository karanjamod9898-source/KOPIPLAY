<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 250" width="100%" height="100%">
  <defs>
    <linearGradient id="df-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0c0714" />
      <stop offset="60%" stop-color="#1f0933" />
      <stop offset="100%" stop-color="#07020d" />
    </linearGradient>
    <filter id="glow-drift">
      <feGaussianBlur stdDeviation="5" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <rect width="400" height="250" fill="url(#df-bg)" />

  <!-- City Skyline -->
  <polygon points="20,130 50,130 50,90 90,90 90,130 140,130 140,60 170,60 170,130 220,130 220,80 260,80 260,130 310,130 310,100 370,100 370,130 400,130 400,250 0,250" fill="#110822" />
  
  <!-- Drifting Tire Smoke and Skidmarks -->
  <path d="M 40 220 Q 180 180 240 160" fill="none" stroke="#00f0ff" stroke-width="4" stroke-linecap="round" opacity="0.6" filter="url(#glow-drift)" />
  <path d="M 60 235 Q 200 195 260 175" fill="none" stroke="#ff0055" stroke-width="4" stroke-linecap="round" opacity="0.6" filter="url(#glow-drift)" />

  <!-- Drifting Sports Car Silhouette -->
  <g transform="translate(190, 125) rotate(-15) scale(1.1)">
    <polygon points="10,35 25,18 70,18 95,30 90,45 15,45" fill="#ff0055" filter="url(#glow-drift)" />
    <polygon points="30,19 45,10 65,10 75,19" fill="#0c0714" />
    <circle cx="28" cy="45" r="10" fill="#000" stroke="#00f0ff" stroke-width="2" />
    <circle cx="80" cy="45" r="10" fill="#000" stroke="#00f0ff" stroke-width="2" />
    <!-- Headlight beam -->
    <polygon points="95,32 180,10 180,60 95,42" fill="rgba(0, 240, 255, 0.25)" />
  </g>

  <!-- Badge -->
  <rect x="15" y="15" width="80" height="22" rx="4" fill="rgba(0, 240, 255, 0.2)" stroke="#00f0ff" stroke-width="1" />
  <text x="55" y="30" fill="#00f0ff" font-family="'Segoe UI', sans-serif" font-size="11" font-weight="800" text-anchor="middle">RACING</text>

  <text x="20" y="235" fill="#fff" font-family="'Segoe UI', sans-serif" font-size="18" font-weight="900" filter="url(#glow-drift)">DRIFT FURY</text>
</svg>
