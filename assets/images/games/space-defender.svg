<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 250" width="100%" height="100%">
  <defs>
    <linearGradient id="space-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#050711" />
      <stop offset="60%" stop-color="#140a2b" />
      <stop offset="100%" stop-color="#04060d" />
    </linearGradient>
    <radialGradient id="nebula" cx="60%" cy="40%" r="50%">
      <stop offset="0%" stop-color="#a855f7" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#000" stop-opacity="0" />
    </radialGradient>
    <filter id="glow-space">
      <feGaussianBlur stdDeviation="5" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <rect width="400" height="250" fill="url(#space-bg)" />
  <rect width="400" height="250" fill="url(#nebula)" />

  <!-- Stars -->
  <circle cx="50" cy="40" r="1.5" fill="#fff" opacity="0.8" />
  <circle cx="120" cy="90" r="1" fill="#00f0ff" opacity="0.9" />
  <circle cx="340" cy="60" r="2" fill="#fff" opacity="0.7" />
  <circle cx="280" cy="180" r="1.5" fill="#a855f7" opacity="0.8" />
  <circle cx="80" cy="210" r="1.2" fill="#fff" opacity="0.6" />
  <circle cx="210" cy="30" r="2" fill="#00f0ff" opacity="0.9" />

  <!-- Alien Mother Drone -->
  <g transform="translate(160, 40) scale(1.1)">
    <polygon points="40,30 15,10 20,45 60,45 65,10" fill="#ff0055" filter="url(#glow-space)" opacity="0.8" />
    <circle cx="40" cy="28" r="7" fill="#ffdd00" filter="url(#glow-space)" />
  </g>

  <!-- Player Starfighter -->
  <g transform="translate(170, 140) scale(1.2)">
    <!-- Plasma Lasers -->
    <line x1="12" y1="-5" x2="12" y2="-45" stroke="#00f0ff" stroke-width="3" filter="url(#glow-space)" />
    <line x1="38" y1="-5" x2="38" y2="-45" stroke="#00f0ff" stroke-width="3" filter="url(#glow-space)" />
    
    <!-- Thruster fire -->
    <polygon points="20,40 25,60 30,40" fill="#00f0ff" filter="url(#glow-space)" />

    <!-- Ship hull -->
    <polygon points="25,5 45,38 25,30 5,38" fill="#a855f7" filter="url(#glow-space)" />
    <polygon points="25,12 40,35 25,28 10,35" fill="#17122a" />
    <circle cx="25" cy="22" r="3.5" fill="#00f0ff" />
  </g>

  <!-- Badge -->
  <rect x="15" y="15" width="80" height="22" rx="4" fill="rgba(168, 85, 247, 0.25)" stroke="#a855f7" stroke-width="1" />
  <text x="55" y="30" fill="#c084fc" font-family="'Segoe UI', sans-serif" font-size="11" font-weight="800" text-anchor="middle">ACTION</text>

  <text x="20" y="235" fill="#fff" font-family="'Segoe UI', sans-serif" font-size="18" font-weight="900" filter="url(#glow-space)">NEBULA DEFENDER</text>
</svg>
