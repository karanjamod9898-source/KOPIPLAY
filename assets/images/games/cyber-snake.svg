<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 250" width="100%" height="100%">
  <defs>
    <linearGradient id="snake-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#040b0e" />
      <stop offset="50%" stop-color="#0a1a1f" />
      <stop offset="100%" stop-color="#030709" />
    </linearGradient>
    <filter id="glow-snake">
      <feGaussianBlur stdDeviation="5" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <rect width="400" height="250" fill="url(#snake-bg)" />

  <!-- Grid mesh -->
  <g stroke="rgba(16, 185, 129, 0.15)" stroke-width="1">
    <line x1="50" y1="0" x2="50" y2="250" />
    <line x1="100" y1="0" x2="100" y2="250" />
    <line x1="150" y1="0" x2="150" y2="250" />
    <line x1="200" y1="0" x2="200" y2="250" />
    <line x1="250" y1="0" x2="250" y2="250" />
    <line x1="300" y1="0" x2="300" y2="250" />
    <line x1="350" y1="0" x2="350" y2="250" />
    <line x1="0" y1="50" x2="400" y2="50" />
    <line x1="0" y1="100" x2="400" y2="100" />
    <line x1="0" y1="150" x2="400" y2="150" />
    <line x1="0" y1="200" x2="400" y2="200" />
  </g>

  <!-- Snake glowing body -->
  <g filter="url(#glow-snake)">
    <!-- Food node -->
    <circle cx="310" cy="90" r="14" fill="#00f0ff" />
    
    <!-- Snake segments -->
    <rect x="80" y="160" width="30" height="30" rx="6" fill="#10b981" opacity="0.6" />
    <rect x="120" y="160" width="30" height="30" rx="6" fill="#10b981" opacity="0.75" />
    <rect x="160" y="160" width="30" height="30" rx="6" fill="#10b981" opacity="0.85" />
    <rect x="160" y="120" width="30" height="30" rx="6" fill="#10b981" opacity="0.9" />
    <rect x="200" y="120" width="30" height="30" rx="6" fill="#10b981" />
    <rect x="240" y="120" width="30" height="30" rx="6" fill="#10b981" />
    <!-- Snake Head -->
    <rect x="240" y="80" width="32" height="32" rx="8" fill="#34d399" />
    <circle cx="260" cy="90" r="3" fill="#000" />
  </g>

  <!-- Badge -->
  <rect x="15" y="15" width="80" height="22" rx="4" fill="rgba(16, 185, 129, 0.2)" stroke="#10b981" stroke-width="1" />
  <text x="55" y="30" fill="#10b981" font-family="'Segoe UI', sans-serif" font-size="11" font-weight="800" text-anchor="middle">ARCADE</text>

  <text x="20" y="235" fill="#fff" font-family="'Segoe UI', sans-serif" font-size="18" font-weight="900" filter="url(#glow-snake)">CYBER SNAKE</text>
</svg>
