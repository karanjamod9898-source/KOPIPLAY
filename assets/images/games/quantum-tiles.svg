<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 250" width="100%" height="100%">
  <defs>
    <linearGradient id="qt-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0518" />
      <stop offset="50%" stop-color="#140a33" />
      <stop offset="100%" stop-color="#070310" />
    </linearGradient>
    <filter id="glow-qt">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <rect width="400" height="250" fill="url(#qt-bg)" />

  <!-- Quantum Laser Web -->
  <g filter="url(#glow-qt)">
    <line x1="120" y1="80" x2="280" y2="170" stroke="#00f0ff" stroke-width="2.5" />
    <line x1="280" y1="80" x2="120" y2="170" stroke="#a855f7" stroke-width="2.5" />
    <line x1="120" y1="80" x2="280" y2="80" stroke="#ff0055" stroke-width="2" />
    <line x1="120" y1="170" x2="280" y2="170" stroke="#ff0055" stroke-width="2" />
    <line x1="200" y1="50" x2="200" y2="200" stroke="#00f0ff" stroke-width="2" stroke-dasharray="6,6" />

    <!-- Quantum Nodes -->
    <circle cx="120" cy="80" r="14" fill="#00f0ff" />
    <circle cx="280" cy="80" r="14" fill="#a855f7" />
    <circle cx="120" cy="170" r="14" fill="#a855f7" />
    <circle cx="280" cy="170" r="14" fill="#00f0ff" />
    <circle cx="200" cy="125" r="18" fill="#ff0055" />
  </g>

  <!-- Badge -->
  <rect x="15" y="15" width="80" height="22" rx="4" fill="rgba(0, 240, 255, 0.2)" stroke="#00f0ff" stroke-width="1" />
  <text x="55" y="30" fill="#00f0ff" font-family="'Segoe UI', sans-serif" font-size="11" font-weight="800" text-anchor="middle">PUZZLE</text>

  <text x="20" y="235" fill="#fff" font-family="'Segoe UI', sans-serif" font-size="18" font-weight="900" filter="url(#glow-qt)">QUANTUM TILES</text>
</svg>
