<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 384" width="100%" height="100%">
  <defs>
    <linearGradient id="sky-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0b172a" />
      <stop offset="60%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <linearGradient id="ramp-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#b45309" />
    </linearGradient>
    <linearGradient id="car-red" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ef4444" />
      <stop offset="100%" stop-color="#991b1b" />
    </linearGradient>
    <linearGradient id="car-gold" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>
    <filter id="glow-blur">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Background Sky & Arena -->
  <rect width="512" height="384" fill="url(#sky-grad)" />

  <!-- Mountainous Descent Backdrop -->
  <polygon points="0,260 80,180 160,260" fill="#1e293b" opacity="0.6" />
  <polygon points="120,260 220,150 320,260" fill="#0f172a" opacity="0.8" />
  <polygon points="280,260 380,170 480,260" fill="#1e293b" opacity="0.6" />

  <!-- Mega Ramp Descent Track -->
  <path d="M -20 120 Q 220 160 380 320 L 520 384 L 0 384 Z" fill="#182030" stroke="#f59e0b" stroke-width="3" />
  <path d="M 0 170 Q 230 200 400 360" fill="none" stroke="#ef4444" stroke-width="2" stroke-dasharray="16,16" />

  <!-- Speed Motion Lines -->
  <line x1="120" y1="80" x2="260" y2="160" stroke="#f59e0b" stroke-width="2" opacity="0.5" stroke-dasharray="8,8" />
  <line x1="80" y1="120" x2="220" y2="200" stroke="#f59e0b" stroke-width="2" opacity="0.7" stroke-dasharray="12,12" />

  <!-- Mid-Air Leaping Muscle Car (Red/Demolition Racer) -->
  <g transform="translate(190, 110) rotate(18) scale(1.4)" filter="url(#glow-blur)">
    <!-- Fire exhaust -->
    <polygon points="-25,12 -45,16 -25,20" fill="#f97316" />
    <polygon points="-25,14 -55,16 -25,18" fill="#fef08a" />

    <!-- Wheels -->
    <circle cx="-10" cy="24" r="8" fill="#111827" stroke="#9ca3af" stroke-width="2" />
    <circle cx="28" cy="24" r="8" fill="#111827" stroke="#9ca3af" stroke-width="2" />
    
    <!-- Body -->
    <polygon points="-20,20 -15,8 5,6 20,12 40,16 38,22 -20,22" fill="url(#car-red)" />
    <!-- Cabin & Windshield -->
    <polygon points="-8,8 2,3 15,3 18,8" fill="#030712" />
    <!-- Spoiler -->
    <rect x="-24" y="2" width="6" height="10" fill="#111827" />
    <rect x="-26" y="0" width="10" height="3" fill="#ef4444" />
    <!-- Headlight glow -->
    <polygon points="40,16 90,8 90,28 40,20" fill="rgba(254, 240, 138, 0.35)" />
  </g>

  <!-- Second Tumbling Car Behind (Colliding / Stunt) -->
  <g transform="translate(90, 60) rotate(-35) scale(0.9)">
    <circle cx="-8" cy="18" r="6" fill="#111827" stroke="#6b7280" stroke-width="1.5" />
    <circle cx="22" cy="18" r="6" fill="#111827" stroke="#6b7280" stroke-width="1.5" />
    <polygon points="-16,15 -12,6 4,4 16,9 32,12 30,17 -16,17" fill="url(#car-gold)" />
    <!-- Spark explosion -->
    <circle cx="34" cy="14" r="10" fill="#f97316" opacity="0.6" filter="url(#glow-blur)" />
  </g>

  <!-- Genuine Platform Badges -->
  <rect x="20" y="20" width="100" height="26" rx="6" fill="rgba(239, 68, 68, 0.25)" stroke="#ef4444" stroke-width="1.5" />
  <text x="70" y="38" fill="#fca5a5" font-family="'Segoe UI', system-ui, sans-serif" font-size="12" font-weight="900" text-anchor="middle" letter-spacing="1">3D WEBGL</text>

  <rect x="130" y="20" width="84" height="26" rx="6" fill="rgba(245, 158, 11, 0.2)" stroke="#f59e0b" stroke-width="1.5" />
  <text x="172" y="38" fill="#fde68a" font-family="'Segoe UI', system-ui, sans-serif" font-size="12" font-weight="900" text-anchor="middle" letter-spacing="1">RACING</text>

  <!-- Bottom Title Banner -->
  <rect x="0" y="320" width="512" height="64" fill="rgba(11, 15, 25, 0.9)" />
  <text x="24" y="354" fill="#ffffff" font-family="'Outfit', 'Segoe UI', system-ui, sans-serif" font-size="20" font-weight="900" letter-spacing="0.5">EPIC RACING: DESCENT ON CARS</text>
  <text x="24" y="372" fill="#94a3b8" font-family="'Segoe UI', system-ui, sans-serif" font-size="11" font-weight="600">BY MIRRA GAMES • OFFICIAL HTML5 WEBGL</text>
</svg>
