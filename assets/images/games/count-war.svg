<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 384" width="100%" height="100%">
  <defs>
    <linearGradient id="cw-bg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0a1122" />
      <stop offset="60%" stop-color="#111d38" />
      <stop offset="100%" stop-color="#090f1d" />
    </linearGradient>
    <linearGradient id="gate-blue" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>
    <linearGradient id="gate-red" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f87171" />
      <stop offset="100%" stop-color="#dc2626" />
    </linearGradient>
    <filter id="cw-glow">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Background Arena -->
  <rect width="512" height="384" fill="url(#cw-bg)" />

  <!-- Runway / Battle Highway Track -->
  <polygon points="176,100 336,100 480,384 32,384" fill="#0f172a" stroke="#1e293b" stroke-width="2" />
  <line x1="256" y1="100" x2="256" y2="384" stroke="#334155" stroke-width="3" stroke-dasharray="12,12" />

  <!-- Multiplier Portal Gate (+50 Blue Gate) -->
  <g transform="translate(136, 140)" filter="url(#cw-glow)">
    <rect x="0" y="0" width="110" height="70" rx="8" fill="url(#gate-blue)" opacity="0.85" stroke="#38bdf8" stroke-width="2" />
    <text x="55" y="44" fill="#ffffff" font-family="'Segoe UI', sans-serif" font-size="28" font-weight="900" text-anchor="middle">×2</text>
  </g>

  <!-- Multiplier Portal Gate (Red Danger Gate) -->
  <g transform="translate(266, 140)" filter="url(#cw-glow)">
    <rect x="0" y="0" width="110" height="70" rx="8" fill="url(#gate-red)" opacity="0.85" stroke="#f87171" stroke-width="2" />
    <text x="55" y="44" fill="#ffffff" font-family="'Segoe UI', sans-serif" font-size="28" font-weight="900" text-anchor="middle">-15</text>
  </g>

  <!-- Stickman Blue Crowd Army (Foreground) -->
  <!-- Center Leader -->
  <g transform="translate(256, 290)" filter="url(#cw-glow)">
    <circle cx="0" cy="-24" r="10" fill="#38bdf8" />
    <line x1="0" y1="-14" x2="0" y2="12" stroke="#38bdf8" stroke-width="5" stroke-linecap="round" />
    <line x1="-12" y1="-4" x2="12" y2="-4" stroke="#38bdf8" stroke-width="4" stroke-linecap="round" />
    <line x1="0" y1="12" x2="-8" y2="30" stroke="#38bdf8" stroke-width="4" stroke-linecap="round" />
    <line x1="0" y1="12" x2="8" y2="30" stroke="#38bdf8" stroke-width="4" stroke-linecap="round" />
  </g>

  <!-- Left Squad -->
  <g transform="translate(210, 275)" filter="url(#cw-glow)">
    <circle cx="0" cy="-20" r="8" fill="#0284c7" />
    <line x1="0" y1="-12" x2="0" y2="8" stroke="#0284c7" stroke-width="4" />
    <line x1="-8" y1="-2" x2="8" y2="-2" stroke="#0284c7" stroke-width="3" />
    <line x1="0" y1="8" x2="-6" y2="24" stroke="#0284c7" stroke-width="3" />
    <line x1="0" y1="8" x2="6" y2="24" stroke="#0284c7" stroke-width="3" />
  </g>

  <g transform="translate(170, 295)" filter="url(#cw-glow)">
    <circle cx="0" cy="-20" r="8" fill="#38bdf8" />
    <line x1="0" y1="-12" x2="0" y2="8" stroke="#38bdf8" stroke-width="4" />
    <line x1="0" y1="8" x2="-6" y2="24" stroke="#38bdf8" stroke-width="3" />
    <line x1="0" y1="8" x2="6" y2="24" stroke="#38bdf8" stroke-width="3" />
  </g>

  <!-- Right Squad -->
  <g transform="translate(302, 275)" filter="url(#cw-glow)">
    <circle cx="0" cy="-20" r="8" fill="#0284c7" />
    <line x1="0" y1="-12" x2="0" y2="8" stroke="#0284c7" stroke-width="4" />
    <line x1="-8" y1="-2" x2="8" y2="-2" stroke="#0284c7" stroke-width="3" />
    <line x1="0" y1="8" x2="-6" y2="24" stroke="#0284c7" stroke-width="3" />
    <line x1="0" y1="8" x2="6" y2="24" stroke="#0284c7" stroke-width="3" />
  </g>

  <g transform="translate(342, 295)" filter="url(#cw-glow)">
    <circle cx="0" cy="-20" r="8" fill="#38bdf8" />
    <line x1="0" y1="-12" x2="0" y2="8" stroke="#38bdf8" stroke-width="4" />
    <line x1="0" y1="8" x2="-6" y2="24" stroke="#38bdf8" stroke-width="3" />
    <line x1="0" y1="8" x2="6" y2="24" stroke="#38bdf8" stroke-width="3" />
  </g>

  <!-- Army Counter Bubble -->
  <g transform="translate(256, 230)" filter="url(#cw-glow)">
    <rect x="-34" y="-14" width="68" height="28" rx="14" fill="#0284c7" stroke="#ffffff" stroke-width="2" />
    <text x="0" y="5" fill="#ffffff" font-family="'Segoe UI', sans-serif" font-size="14" font-weight="900" text-anchor="middle">128</text>
  </g>

  <!-- Category Badge -->
  <rect x="24" y="24" width="90" height="26" rx="6" fill="rgba(239, 68, 68, 0.2)" stroke="#ef4444" stroke-width="1.5" />
  <text x="69" y="41" fill="#ef4444" font-family="'Segoe UI', sans-serif" font-size="12" font-weight="800" text-anchor="middle" letter-spacing="1">ACTION</text>

  <!-- Title Bottom -->
  <text x="24" y="360" fill="#ffffff" font-family="'Segoe UI', sans-serif" font-size="22" font-weight="900" filter="url(#cw-glow)" letter-spacing="0.5">COUNT WAR</text>
</svg>
