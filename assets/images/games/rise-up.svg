<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 384" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="ru-bg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0b1120" />
      <stop offset="50%" stop-color="#111c35" />
      <stop offset="100%" stop-color="#070a14" />
    </linearGradient>

    <!-- Hot Air Balloon Gradient -->
    <linearGradient id="balloon-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f43f5e" />
      <stop offset="50%" stop-color="#fb7185" />
      <stop offset="100%" stop-color="#e11d48" />
    </linearGradient>

    <!-- Shield Glow Gradient -->
    <linearGradient id="shield-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>

    <!-- Neon Glow Filter -->
    <filter id="ru-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="5" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="shield-glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="512" height="384" fill="url(#ru-bg)" />

  <!-- Grid lines / Sky Altitude Lines -->
  <line x1="40" y1="80" x2="472" y2="80" stroke="rgba(56, 189, 248, 0.08)" stroke-width="1" stroke-dasharray="8,8" />
  <line x1="40" y1="160" x2="472" y2="160" stroke="rgba(56, 189, 248, 0.08)" stroke-width="1" stroke-dasharray="8,8" />
  <line x1="40" y1="240" x2="472" y2="240" stroke="rgba(56, 189, 248, 0.08)" stroke-width="1" stroke-dasharray="8,8" />
  <line x1="40" y1="320" x2="472" y2="320" stroke="rgba(56, 189, 248, 0.08)" stroke-width="1" stroke-dasharray="8,8" />

  <!-- Obstacle Shapes Falling (Geometrics) -->
  <g opacity="0.85">
    <!-- Spinning geometric blocks -->
    <polygon points="120,70 145,105 95,105" fill="#a855f7" stroke="#c084fc" stroke-width="2" />
    <rect x="360" y="85" width="28" height="28" rx="4" fill="#f59e0b" stroke="#fbbf24" stroke-width="2" transform="rotate(25 374 99)" />
    <circle cx="210" cy="65" r="12" fill="#ec4899" stroke="#f472b6" stroke-width="2" />
    <rect x="290" y="55" width="22" height="22" rx="3" fill="#10b981" stroke="#34d399" stroke-width="2" transform="rotate(40 301 66)" />
    <polygon points="180,120 195,145 165,145" fill="#06b6d4" stroke="#22d3ee" stroke-width="2" />
    <circle cx="340" cy="140" r="10" fill="#e11d48" stroke="#fb7185" stroke-width="1.5" />
  </g>

  <!-- Interactive Deflector / Protective Shield (Orb) -->
  <g transform="translate(256, 175)" filter="url(#shield-glow)">
    <circle cx="0" cy="0" r="26" fill="url(#shield-grad)" stroke="#bae6fd" stroke-width="3" opacity="0.95" />
    <circle cx="-6" cy="-6" r="8" fill="#ffffff" opacity="0.6" />
    <circle cx="0" cy="0" r="32" fill="none" stroke="rgba(56, 189, 248, 0.5)" stroke-width="2" stroke-dasharray="6,4" />
  </g>

  <!-- The Rising Hot Air Balloon -->
  <g transform="translate(256, 275)" filter="url(#ru-glow)">
    <!-- Balloon Envelope -->
    <ellipse cx="0" cy="-25" rx="36" ry="44" fill="url(#balloon-grad)" stroke="#ffe4e6" stroke-width="2" />
    
    <!-- Decorative Stripes on Balloon -->
    <path d="M -16 -65 C -24 -25 -24 0 -10 15" fill="none" stroke="rgba(255, 255, 255, 0.45)" stroke-width="2.5" />
    <path d="M 16 -65 C 24 -25 24 0 10 15" fill="none" stroke="rgba(255, 255, 255, 0.45)" stroke-width="2.5" />
    <line x1="0" y1="-69" x2="0" y2="19" stroke="rgba(255, 255, 255, 0.45)" stroke-width="2.5" />

    <!-- Balloon Base Neck -->
    <polygon points="-12,16 12,16 8,24 -8,24" fill="#be123c" />

    <!-- Ropes to Basket -->
    <line x1="-8" y1="24" x2="-6" y2="34" stroke="#e2e8f0" stroke-width="1.5" />
    <line x1="8" y1="24" x2="6" y2="34" stroke="#e2e8f0" stroke-width="1.5" />

    <!-- Passenger Basket -->
    <rect x="-8" y="34" width="16" height="12" rx="2" fill="#d97706" stroke="#fde68a" stroke-width="1.5" />
  </g>

  <!-- Subtle Title Badge at bottom -->
  <rect x="156" y="336" width="200" height="30" rx="8" fill="rgba(15, 23, 42, 0.85)" stroke="rgba(56, 189, 248, 0.3)" stroke-width="1.5" />
  <text x="256" y="356" fill="#38bdf8" font-family="'Segoe UI', -apple-system, sans-serif" font-size="13" font-weight="800" text-anchor="middle" letter-spacing="1.5">RISE UP BALLOON</text>
</svg>

