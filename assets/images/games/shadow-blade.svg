<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 250" width="100%" height="100%">
  <defs>
    <linearGradient id="sb-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0510" />
      <stop offset="50%" stop-color="#190724" />
      <stop offset="100%" stop-color="#050208" />
    </linearGradient>
    <filter id="glow-sb">
      <feGaussianBlur stdDeviation="5" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <rect width="400" height="250" fill="url(#sb-bg)" />

  <!-- Giant Blood Red Neon Moon -->
  <circle cx="200" cy="100" r="70" fill="#ff0055" filter="url(#glow-sb)" opacity="0.8" />

  <!-- Cyber Katana Slash Arc -->
  <path d="M 60 180 Q 200 40 340 160" fill="none" stroke="#00f0ff" stroke-width="5" stroke-linecap="round" filter="url(#glow-sb)" />
  <path d="M 70 190 Q 200 60 330 170" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" />

  <!-- Cyber Ninja Silhouette -->
  <g transform="translate(160, 90) scale(1)">
    <polygon points="40,20 20,60 60,60" fill="#0c0714" />
    <circle cx="40" cy="15" r="10" fill="#0c0714" />
    <!-- Visor -->
    <rect x="34" y="12" width="16" height="4" fill="#00f0ff" filter="url(#glow-sb)" />
  </g>

  <!-- Badge -->
  <rect x="15" y="15" width="80" height="22" rx="4" fill="rgba(255, 0, 85, 0.25)" stroke="#ff0055" stroke-width="1" />
  <text x="55" y="30" fill="#ff0055" font-family="'Segoe UI', sans-serif" font-size="11" font-weight="800" text-anchor="middle">ACTION</text>

  <text x="20" y="235" fill="#fff" font-family="'Segoe UI', sans-serif" font-size="18" font-weight="900" filter="url(#glow-sb)">SHADOW BLADE</text>
</svg>
