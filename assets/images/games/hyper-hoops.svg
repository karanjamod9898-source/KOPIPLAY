<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 250" width="100%" height="100%">
  <defs>
    <linearGradient id="hh-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0817" />
      <stop offset="50%" stop-color="#1f103d" />
      <stop offset="100%" stop-color="#070411" />
    </linearGradient>
    <filter id="glow-hh">
      <feGaussianBlur stdDeviation="5" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <rect width="400" height="250" fill="url(#hh-bg)" />

  <!-- Basketball Backboard & Neon Rim -->
  <g transform="translate(140, 50)" filter="url(#glow-hh)">
    <!-- Backboard -->
    <rect x="0" y="0" width="120" height="85" rx="6" fill="none" stroke="#fff" stroke-width="3" />
    <rect x="35" y="40" width="50" height="35" fill="none" stroke="#ff3366" stroke-width="2" />
    
    <!-- Rim -->
    <ellipse cx="60" cy="80" rx="24" ry="7" fill="none" stroke="#ff9900" stroke-width="4" />
    
    <!-- Net lines -->
    <line x1="38" y1="82" x2="48" y2="115" stroke="#fff" stroke-width="1.5" opacity="0.7" />
    <line x1="82" y1="82" x2="72" y2="115" stroke="#fff" stroke-width="1.5" opacity="0.7" />
    <line x1="50" y1="84" x2="56" y2="115" stroke="#fff" stroke-width="1.5" opacity="0.7" />
    <line x1="70" y1="84" x2="64" y2="115" stroke="#fff" stroke-width="1.5" opacity="0.7" />
  </g>

  <!-- Flaming Basketball with trail -->
  <g transform="translate(260, 45)" filter="url(#glow-hh)">
    <!-- Fire trail -->
    <path d="M 40 -10 Q 70 -30 90 -10 Q 60 20 20 25" fill="#ff0055" opacity="0.8" />
    <circle cx="20" cy="15" r="22" fill="#ff7700" />
    <!-- Ball seams -->
    <path d="M 0 15 Q 20 5 40 15" fill="none" stroke="#000" stroke-width="2" />
    <path d="M 20 -7 Q 10 15 20 37" fill="none" stroke="#000" stroke-width="2" />
  </g>

  <!-- Badge -->
  <rect x="15" y="15" width="80" height="22" rx="4" fill="rgba(236, 72, 153, 0.2)" stroke="#ec4899" stroke-width="1" />
  <text x="55" y="30" fill="#ec4899" font-family="'Segoe UI', sans-serif" font-size="11" font-weight="800" text-anchor="middle">SPORTS</text>

  <text x="20" y="235" fill="#fff" font-family="'Segoe UI', sans-serif" font-size="18" font-weight="900" filter="url(#glow-hh)">HYPER HOOPS 3D</text>
</svg>
