<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 250" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16" />
      <stop offset="50%" stop-color="#111827" />
      <stop offset="100%" stop-color="#05070d" />
    </linearGradient>
    <linearGradient id="cyan-glow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f0ff" />
      <stop offset="100%" stop-color="#a855f7" />
    </linearGradient>
    <linearGradient id="sun-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ff007f" />
      <stop offset="100%" stop-color="#ffaa00" />
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <rect width="400" height="250" fill="url(#bg)" />

  <!-- Retro Sun -->
  <circle cx="200" cy="110" r="60" fill="url(#sun-grad)" opacity="0.85" filter="url(#glow)" />
  <line x1="140" y1="100" x2="260" y2="100" stroke="#090d16" stroke-width="3" />
  <line x1="145" y1="112" x2="255" y2="112" stroke="#090d16" stroke-width="4" />
  <line x1="155" y1="126" x2="245" y2="126" stroke="#090d16" stroke-width="5" />

  <!-- Mountain Silhouettes -->
  <polygon points="40,140 110,90 180,140" fill="#1e1035" opacity="0.9" />
  <polygon points="150,140 230,80 300,140" fill="#130b24" opacity="0.9" />
  <polygon points="270,140 330,95 390,140" fill="#1e1035" opacity="0.9" />

  <!-- Synthwave Grid Road -->
  <polygon points="120,140 280,140 400,250 0,250" fill="#080c18" stroke="#00f0ff" stroke-width="2" />
  <line x1="200" y1="140" x2="200" y2="250" stroke="#00f0ff" stroke-width="2" stroke-dasharray="12,12" />
  <line x1="160" y1="140" x2="100" y2="250" stroke="#00f0ff" stroke-width="1.5" opacity="0.6" />
  <line x1="240" y1="140" x2="300" y2="250" stroke="#00f0ff" stroke-width="1.5" opacity="0.6" />
  
  <!-- Cyber Supercar -->
  <g transform="translate(160, 175) scale(0.8)">
    <!-- Exhaust Glow -->
    <circle cx="20" cy="55" r="12" fill="#00f0ff" filter="url(#glow)" opacity="0.7" />
    <circle cx="80" cy="55" r="12" fill="#00f0ff" filter="url(#glow)" opacity="0.7" />
    <!-- Car Body -->
    <polygon points="25,50 15,30 25,15 75,15 85,30 75,50" fill="#00f0ff" filter="url(#glow)" />
    <polygon points="28,46 20,28 30,18 70,18 80,28 72,46" fill="#0b111e" />
    <!-- Rear light -->
    <rect x="25" y="44" width="50" height="4" fill="#ff0055" filter="url(#glow)" />
    <!-- Cockpit -->
    <polygon points="35,32 40,20 60,20 65,32" fill="#00f0ff" opacity="0.7" />
  </g>

  <!-- Title Badge -->
  <rect x="15" y="15" width="80" height="22" rx="4" fill="rgba(0, 240, 255, 0.2)" stroke="#00f0ff" stroke-width="1" />
  <text x="55" y="30" fill="#00f0ff" font-family="'Segoe UI', sans-serif" font-size="11" font-weight="800" text-anchor="middle">RACING</text>
  
  <text x="20" y="235" fill="#fff" font-family="'Segoe UI', sans-serif" font-size="18" font-weight="900" filter="url(#glow)">NEON HORIZON</text>
</svg>
