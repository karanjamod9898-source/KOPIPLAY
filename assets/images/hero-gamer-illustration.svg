<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 220" width="100%" height="auto">
  <defs>
    <!-- Lighting Glows -->
    <radialGradient id="hero-glow-cyan" cx="70%" cy="40%" r="50%">
      <stop offset="0%" stop-color="#22D3EE" stop-opacity="0.35" />
      <stop offset="60%" stop-color="#06B6D4" stop-opacity="0.1" />
      <stop offset="100%" stop-color="#0891B2" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="hero-glow-purple" cx="30%" cy="50%" r="45%">
      <stop offset="0%" stop-color="#A855F7" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#6D28D9" stop-opacity="0" />
    </radialGradient>

    <!-- Gamer Hoodie Gold Gradient -->
    <linearGradient id="hoodie-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDE047" />
      <stop offset="50%" stop-color="#EAB308" />
      <stop offset="100%" stop-color="#CA8A04" />
    </linearGradient>

    <!-- Gamer Hair Gradient -->
    <linearGradient id="hair-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#78350F" />
      <stop offset="50%" stop-color="#451A03" />
      <stop offset="100%" stop-color="#292524" />
    </linearGradient>

    <!-- Floating Controller Body Gradient -->
    <linearGradient id="float-pad-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E9D5FF" />
      <stop offset="40%" stop-color="#C084FC" />
      <stop offset="100%" stop-color="#7E22CE" />
    </linearGradient>

    <!-- Star & Crown Gold Glow -->
    <filter id="gold-glow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="0" stdDeviation="4" flood-color="#FACC15" flood-opacity="0.8" />
    </filter>

    <filter id="cyan-headphone-glow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="0" stdDeviation="5" flood-color="#38BDF8" flood-opacity="0.9" />
    </filter>
  </defs>

  <!-- Ambient Glow Circles -->
  <rect x="0" y="0" width="420" height="220" fill="url(#hero-glow-purple)" />
  <circle cx="300" cy="100" r="120" fill="url(#hero-glow-cyan)" />

  <!-- Floating Golden Crown Above Controller -->
  <g transform="translate(110, 24)" filter="url(#gold-glow)">
    <path d="M 0 16 L 4 0 L 14 10 L 24 0 L 28 16 Z" fill="#FACC15" />
    <circle cx="4" cy="0" r="2.2" fill="#FEF08A" />
    <circle cx="14" cy="9" r="2.2" fill="#FEF08A" />
    <circle cx="24" cy="0" r="2.2" fill="#FEF08A" />
    <!-- Crown Band -->
    <rect x="0" y="16" width="28" height="5" rx="2" fill="#EAB308" />
    <circle cx="7" cy="18.5" r="1.3" fill="#FFFFFF" />
    <circle cx="14" cy="18.5" r="1.3" fill="#22D3EE" />
    <circle cx="21" cy="18.5" r="1.3" fill="#FFFFFF" />
  </g>

  <!-- Floating Cute 3D Lilac Gamepad (Left of Boy) -->
  <g transform="translate(48, 55)">
    <!-- Lilac Pad Body -->
    <path d="M 16 28 C 8 45 4 70 18 86 C 26 94 38 88 45 74 L 52 68 C 55 65 59 65 62 68 L 68 74 C 76 88 88 94 96 86 C 110 70 106 45 98 28 C 90 18 80 14 62 14 C 44 14 34 18 16 28 Z"
          fill="url(#float-pad-grad)" filter="drop-shadow(0 6px 12px rgba(0,0,0,0.35))" />
    <!-- Bumpers -->
    <ellipse cx="32" cy="16" rx="10" ry="3.5" fill="rgba(255,255,255,0.6)" />
    <ellipse cx="80" cy="16" rx="10" ry="3.5" fill="rgba(255,255,255,0.6)" />
    <!-- Directional Pad -->
    <g transform="translate(26, 40)">
      <path d="M 6 0 L 11 0 L 11 6 L 17 6 L 17 11 L 11 11 L 11 17 L 6 17 L 6 11 L 0 11 L 0 6 L 6 6 Z" fill="#FFFFFF" />
    </g>
    <!-- Analog Sticks -->
    <circle cx="44" cy="54" r="7" fill="#4C1D95" stroke="#7E22CE" stroke-width="1.5" />
    <circle cx="68" cy="54" r="7" fill="#4C1D95" stroke="#7E22CE" stroke-width="1.5" />
    <!-- Colorful Buttons -->
    <circle cx="82" cy="38" r="3" fill="#FACC15" />
    <circle cx="89" cy="45" r="3" fill="#22D3EE" />
    <circle cx="82" cy="52" r="3" fill="#10B981" />
    <circle cx="75" cy="45" r="3" fill="#F43F5E" />
  </g>

  <!-- Golden 5-point Cartoon Stars Floating Around -->
  <!-- Top Right Big Star -->
  <g transform="translate(370, 32)" filter="url(#gold-glow)">
    <polygon points="12,0 15,8 24,9 17,15 19,24 12,19 5,24 7,15 0,9 9,8" fill="#FACC15" />
  </g>
  <!-- Middle Star -->
  <g transform="translate(180, 85)" filter="url(#gold-glow)">
    <polygon points="9,0 11,6 18,7 13,12 14,18 9,14 4,18 5,12 0,7 7,6" fill="#FDE047" />
  </g>

  <!-- Anime Gaming Boy Character (Right Side) -->
  <g transform="translate(205, 10)">
    <!-- Body / Shoulders / Golden Yellow Hoodie Jacket -->
    <path d="M 40 145 C 5 155 -10 185 -15 220 L 165 220 C 160 185 145 155 110 145 Z" fill="url(#hoodie-grad)" />
    <!-- Black Undershirt Collar -->
    <path d="M 58 142 Q 75 162 92 142 Q 75 152 58 142 Z" fill="#18181B" />
    <!-- Hoodie Seams & Drawstrings -->
    <path d="M 64 150 L 64 175" stroke="#CA8A04" stroke-width="2.5" stroke-linecap="round" />
    <path d="M 86 150 L 86 175" stroke="#CA8A04" stroke-width="2.5" stroke-linecap="round" />
    <circle cx="64" cy="177" r="2.5" fill="#FEF08A" />
    <circle cx="86" cy="177" r="2.5" fill="#FEF08A" />

    <!-- Neck -->
    <path d="M 62 120 L 62 145 Q 75 150 88 145 L 88 120 Z" fill="#FED7AA" />

    <!-- Head / Face -->
    <path d="M 42 70 C 42 110 56 130 75 130 C 94 130 108 110 108 70 C 108 40 94 30 75 30 C 56 30 42 40 42 70 Z" fill="#FFEDD5" />

    <!-- Happy Open Eyes (Anime Gaming Style) -->
    <!-- Left Eye -->
    <ellipse cx="58" cy="74" rx="7" ry="9" fill="#1E293B" />
    <ellipse cx="56" cy="71" rx="3" ry="4" fill="#FFFFFF" />
    <circle cx="60" cy="78" r="1.5" fill="#38BDF8" />
    <!-- Right Eye -->
    <ellipse cx="90" cy="74" rx="7" ry="9" fill="#1E293B" />
    <ellipse cx="88" cy="71" rx="3" ry="4" fill="#FFFFFF" />
    <circle cx="92" cy="78" r="1.5" fill="#38BDF8" />

    <!-- Eyebrows (Excited / Happy) -->
    <path d="M 50 63 Q 58 58 66 63" stroke="#451A03" stroke-width="3" stroke-linecap="round" fill="none" />
    <path d="M 82 63 Q 90 58 98 63" stroke="#451A03" stroke-width="3" stroke-linecap="round" fill="none" />

    <!-- Cute Anime Nose -->
    <circle cx="75" cy="84" r="1.2" fill="#FDBA74" />

    <!-- Happy Open-Mouth Smile -->
    <path d="M 62 92 Q 75 112 88 92 Q 75 96 62 92 Z" fill="#991B1B" />
    <!-- White Teeth -->
    <path d="M 66 94 Q 75 98 84 94 Q 75 93 66 94 Z" fill="#FFFFFF" />
    <!-- Pink Tongue -->
    <path d="M 68 103 Q 75 107 82 103 Q 75 98 68 103 Z" fill="#F43F5E" />

    <!-- Rosy Cheeks -->
    <ellipse cx="48" cy="85" rx="5" ry="3" fill="#FDA4AF" opacity="0.6" />
    <ellipse cx="102" cy="85" rx="5" ry="3" fill="#FDA4AF" opacity="0.6" />

    <!-- Anime Brown Spiky Hair -->
    <path d="M 38 65 
             C 34 40 45 20 75 18 
             C 105 20 116 40 112 65 
             L 108 55 C 114 42 108 30 92 25 
             L 88 32 C 84 22 75 22 70 30 
             L 64 26 C 60 32 55 35 52 45 
             L 48 40 C 44 48 44 58 38 65 Z" fill="url(#hair-grad)" />
    <!-- Front Hair Bangs Fringe -->
    <path d="M 44 58 Q 55 68 62 60 Q 72 72 82 58 Q 92 68 102 56 Q 96 46 88 48 Q 78 45 68 48 Q 58 45 44 58 Z" fill="url(#hair-grad)" />

    <!-- Gaming Headphones (Over-Ear with Cyan Neon Ring Light) -->
    <!-- Headband -->
    <path d="M 38 65 C 38 28 60 12 75 12 C 90 12 112 28 112 65" fill="none" stroke="#0F172A" stroke-width="7" stroke-linecap="round" />
    <path d="M 40 65 C 40 30 60 14 75 14 C 90 14 110 30 110 65" fill="none" stroke="#334155" stroke-width="4" stroke-linecap="round" />

    <!-- Left Ear Cup with Cyan Neon Ring -->
    <g transform="translate(32, 58)" filter="url(#cyan-headphone-glow)">
      <rect x="0" y="0" width="14" height="26" rx="7" fill="#0F172A" />
      <rect x="2" y="2" width="10" height="22" rx="5" fill="#1E293B" />
      <circle cx="7" cy="13" r="4.5" fill="none" stroke="#22D3EE" stroke-width="2" />
    </g>

    <!-- Right Ear Cup with Cyan Neon Ring -->
    <g transform="translate(104, 58)" filter="url(#cyan-headphone-glow)">
      <rect x="0" y="0" width="14" height="26" rx="7" fill="#0F172A" />
      <rect x="2" y="2" width="10" height="22" rx="5" fill="#1E293B" />
      <circle cx="7" cy="13" r="4.5" fill="none" stroke="#22D3EE" stroke-width="2" />
    </g>

    <!-- Gamer Boy Hands Holding Dark Controller -->
    <g transform="translate(35, 148)">
      <!-- Controller Body in Boy's Hands -->
      <path d="M 12 14 C 6 24 4 36 14 44 C 18 47 24 44 28 36 L 36 32 C 38 31 42 31 44 32 L 52 36 C 56 44 62 47 66 44 C 76 36 74 24 68 14 C 62 8 56 6 40 6 C 24 6 18 8 12 14 Z"
            fill="#1E1B4B" stroke="#4338CA" stroke-width="1.5" />
      <!-- D-Pad (White) -->
      <path d="M 18 18 L 22 18 L 22 15 L 25 15 L 25 18 L 29 18 L 29 21 L 25 21 L 25 24 L 22 24 L 22 21 L 18 21 Z" fill="#FFFFFF" />
      <!-- Action Buttons -->
      <circle cx="56" cy="18" r="2" fill="#FACC15" />
      <circle cx="61" cy="22" r="2" fill="#22D3EE" />
      <circle cx="56" cy="26" r="2" fill="#10B981" />
      <circle cx="51" cy="22" r="2" fill="#F43F5E" />

      <!-- Left Hand Fingers Wrapping Controller -->
      <ellipse cx="14" cy="30" rx="6" ry="10" fill="#FED7AA" />
      <circle cx="16" cy="24" r="4" fill="#FFEDD5" />
      <!-- Right Hand Fingers Wrapping Controller -->
      <ellipse cx="66" cy="30" rx="6" ry="10" fill="#FED7AA" />
      <circle cx="64" cy="24" r="4" fill="#FFEDD5" />
    </g>
  </g>
</svg>
