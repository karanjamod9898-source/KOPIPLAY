<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 220" width="100%" height="auto">
  <defs>
    <!-- Fluid Neon Light Gradients -->
    <linearGradient id="neon-cyan-grad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06B6D4" stop-opacity="0" />
      <stop offset="40%" stop-color="#22D3EE" stop-opacity="0.8" />
      <stop offset="80%" stop-color="#38BDF8" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#818CF8" stop-opacity="0" />
    </linearGradient>

    <linearGradient id="neon-purple-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#C084FC" stop-opacity="0" />
      <stop offset="35%" stop-color="#9333EA" stop-opacity="0.75" />
      <stop offset="75%" stop-color="#4F46E5" stop-opacity="0.85" />
      <stop offset="100%" stop-color="#06B6D4" stop-opacity="0" />
    </linearGradient>

    <!-- 3D Controller Body Gradient -->
    <linearGradient id="pad-3d-body" x1="15%" y1="0%" x2="85%" y2="100%">
      <stop offset="0%" stop-color="#DDD6FE" />
      <stop offset="25%" stop-color="#A78BFA" />
      <stop offset="65%" stop-color="#6D28D9" />
      <stop offset="100%" stop-color="#4C1D95" />
    </linearGradient>

    <linearGradient id="pad-handle-shade" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#5B21B6" />
      <stop offset="100%" stop-color="#2E1065" />
    </linearGradient>

    <!-- Neon Glow Filter -->
    <filter id="neon-glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="6" result="blur1" />
      <feGaussianBlur stdDeviation="14" result="blur2" />
      <feMerge>
        <feMergeNode in="blur2" />
        <feMergeNode in="blur1" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="sparks-glow" x="-40%" y="-40%" width="180%" height="180%">
      <feDropShadow dx="0" dy="0" stdDeviation="5" flood-color="#FACC15" flood-opacity="0.9" />
    </filter>
  </defs>

  <!-- Flowing Neon Energy Ribbons / Waves Underneath -->
  <g opacity="0.85" filter="url(#neon-glow)">
    <path d="M -20 190 Q 40 120 120 170 T 260 140" fill="none" stroke="url(#neon-cyan-grad)" stroke-width="4.5" stroke-linecap="round" />
    <path d="M -30 210 Q 50 150 140 195 T 280 160" fill="none" stroke="url(#neon-purple-grad)" stroke-width="3" stroke-linecap="round" />
    <path d="M 0 170 Q 70 210 160 165 T 270 200" fill="none" stroke="#38BDF8" stroke-width="2" stroke-opacity="0.5" stroke-linecap="round" />
  </g>

  <!-- Comic Energy Sparks / Crown Above Controller -->
  <g transform="translate(68, 50)" filter="url(#sparks-glow)">
    <!-- Left Spark -->
    <path d="M 0 12 L 6 0 L 7 8 Z" fill="#FACC15" />
    <!-- Center Big Spark -->
    <path d="M 16 16 L 22 -3 L 26 12 Z" fill="#FDE047" />
    <!-- Right Spark -->
    <path d="M 33 11 L 41 2 L 38 12 Z" fill="#FACC15" />
  </g>

  <!-- 3D Gaming Controller -->
  <g transform="translate(18, 70)">
    <!-- Controller Shadow -->
    <ellipse cx="65" cy="85" rx="58" ry="18" fill="rgba(0, 0, 0, 0.45)" filter="blur(6px)" />

    <!-- Main Controller Body (Rotated ~-10deg for 3D dynamic look) -->
    <g transform="rotate(-8 60 55)">
      <!-- Left Under-Handle Depth -->
      <path d="M 12 40 C 4 60 2 85 18 98 C 28 106 42 98 48 82 L 32 46 Z" fill="url(#pad-handle-shade)" />
      <!-- Right Under-Handle Depth -->
      <path d="M 108 40 C 116 60 118 85 102 98 C 92 106 78 98 72 82 L 88 46 Z" fill="url(#pad-handle-shade)" />

      <!-- Controller Main Upper Hull -->
      <path d="M 22 30 
               C 12 46 6 72 18 92 
               C 26 102 40 96 48 80 
               L 54 74 
               C 58 71 62 71 66 74 
               L 72 80 
               C 80 96 94 102 102 92 
               C 114 72 108 46 98 30 
               C 90 18 78 14 60 14 
               C 42 14 30 18 22 30 Z"
            fill="url(#pad-3d-body)" />

      <!-- Top Highlights & Bumpers -->
      <ellipse cx="36" cy="18" rx="14" ry="4" fill="rgba(255, 255, 255, 0.45)" />
      <ellipse cx="84" cy="18" rx="14" ry="4" fill="rgba(255, 255, 255, 0.45)" />
      
      <!-- Directional D-Pad (Solid White with Subtle Bevel) -->
      <g transform="translate(28, 42)">
        <path d="M 8 0 L 14 0 L 14 8 L 22 8 L 22 14 L 14 14 L 14 22 L 8 22 L 8 14 L 0 14 L 0 8 L 8 8 Z" fill="#FFFFFF" />
        <circle cx="11" cy="11" r="2.5" fill="#DDD6FE" />
      </g>

      <!-- Analog Thumbsticks -->
      <g transform="translate(46, 56)">
        <circle cx="0" cy="0" r="9" fill="#2E1065" stroke="#4C1D95" stroke-width="2" />
        <circle cx="0" cy="0" r="6.5" fill="#7C3AED" />
        <circle cx="-1.5" cy="-1.5" r="2" fill="#A78BFA" />
      </g>
      <g transform="translate(74, 56)">
        <circle cx="0" cy="0" r="9" fill="#2E1065" stroke="#4C1D95" stroke-width="2" />
        <circle cx="0" cy="0" r="6.5" fill="#7C3AED" />
        <circle cx="-1.5" cy="-1.5" r="2" fill="#A78BFA" />
      </g>

      <!-- 4 Action Buttons (Y, B, A, X) with Neon Colors -->
      <g transform="translate(86, 38)">
        <circle cx="6" cy="-4" r="3.8" fill="#FACC15" />
        <circle cx="14" cy="4" r="3.8" fill="#22D3EE" />
        <circle cx="6" cy="12" r="3.8" fill="#10B981" />
        <circle cx="-2" cy="4" r="3.8" fill="#F43F5E" />
      </g>
    </g>
  </g>
</svg>
